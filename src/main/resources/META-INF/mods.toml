#logoFile = ""

# The yt-dlp download screen is built with NarutoUI, which in turn needs Modern UI. Both are
# optional: without them the mod keeps working, it just has no config screen.
[[dependencies.narutoloading]]
modId = "modernui"
mandatory = false
versionRange = "[3.12.0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.narutoloading]]
modId = "narutoui"
mandatory = false
versionRange = "[1.20.1-1.10.0,)"
ordering = "AFTER"
side = "CLIENT"

# Used for the immediate "a frame block was broken" event; without it the
# low-frequency border scan still removes invalid walls.
[[dependencies.narutoloading]]
modId = "duplicationless"
mandatory = false
versionRange = "[1.20.1-1.2.1,)"
ordering = "AFTER"
side = "BOTH"