modLoader = "javafml"
loaderVersion = "[4,)"
#issueTrackerURL = ""
license = "MIT"

[[mods]]
modId = "narutoloading"
version = "${version}"
displayName = "NarutoLoading"
authors = "Kall"
description = '''
The dumbest possible way to play videos during Minecraft loading screens.

NarutoLoading replaces the vanilla background with custom video & audio playback,
just so you can stare at your favorite CG a little longer than necessary.
'''

logoFile = "naruto.png"

[[dependencies.narutoloading]]
modId="duplicationless"
mandatory=true
versionRange="[1.0.5,)"
ordering="NONE"
side="CLIENT"

[[mixins]]
config = "narutoloading.mixins.json"
